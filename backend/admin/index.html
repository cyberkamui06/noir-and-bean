<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Noir & Bean — Admin</title>


    <script>

        const adminToken =
            localStorage.getItem("adminToken");


        if (!adminToken) {

            window.location.replace(
                "login.html"
            );

        }

    </script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                sans-serif;

            background:
                #f5f1ec;

            color:
                #211b17;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background:
                #211b17;

            color:
                white;

            padding:
                24px 40px;

        }


        header h1 {

            font-size:
                24px;

            letter-spacing:
                1px;

        }


        header p {

            margin-top:
                5px;

            color:
                #cfc5bd;

            font-size:
                14px;

        }


        main {

            max-width:
                1200px;

            margin:
                40px auto;

            padding:
                0 20px;

        }


        /* =========================
           STATISTICS
        ========================= */

        .stats-grid {

            display:
                grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap:
                15px;

            margin-bottom:
                30px;

        }


        .stat-card {

            background:
                white;

            padding:
                22px;

            border-radius:
                10px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.06);

        }


        .stat-label {

            display:
                block;

            color:
                #756d66;

            font-size:
                12px;

            font-weight:
                bold;

            letter-spacing:
                1px;

            margin-bottom:
                10px;

        }


        .stat-card strong {

            display:
                block;

            font-size:
                28px;

            color:
                #211b17;

        }


        /* =========================
           NAVIGATION
        ========================= */

        .admin-navigation {

            display:
                flex;

            gap:
                10px;

            margin-bottom:
                25px;

            border-bottom:
                1px solid #ddd;

            padding-bottom:
                12px;

        }


        .nav-btn {

            border:
                none;

            background:
                transparent;

            color:
                #756d66;

            padding:
                12px 20px;

            border-radius:
                6px;

            font-size:
                15px;

            font-weight:
                bold;

            cursor:
                pointer;

        }


        .nav-btn:hover {

            background:
                #e9e1da;

        }


        .nav-btn.active {

            background:
                #211b17;

            color:
                white;

        }


        /* =========================
           SECTIONS
        ========================= */

        .admin-section {

            display:
                none;

        }


        .admin-section.active {

            display:
                block;

        }


        /* =========================
           DASHBOARD HEADER
        ========================= */

        .dashboard-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                25px;

        }


        .dashboard-header h2 {

            font-size:
                28px;

        }


        .header-buttons {

            display:
                flex;

            gap:
                10px;

        }


        .refresh-btn,
        .logout-btn {

            border:
                none;

            background:
                #211b17;

            color:
                white;

            padding:
                12px 18px;

            border-radius:
                6px;

            cursor:
                pointer;

        }


        .refresh-btn:hover,
        .logout-btn:hover {

            opacity:
                0.85;

        }


        /* =========================
           ORDERS
        ========================= */

        #orders-container {

            display:
                grid;

            gap:
                20px;

        }


        .order-card {

            background:
                white;

            border-radius:
                10px;

            padding:
                25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.06);

        }


        .order-top {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                20px;

        }


        .order-id {

            font-size:
                20px;

            font-weight:
                bold;

        }


        .status {

            padding:
                7px 12px;

            border-radius:
                20px;

            font-size:
                12px;

            font-weight:
                bold;

            text-transform:
                uppercase;

            background:
                #eee;

        }


        .customer {

            margin-bottom:
                20px;

            line-height:
                1.7;

            color:
                #5f5750;

        }


        .items {

            border-top:
                1px solid #eee;

            border-bottom:
                1px solid #eee;

            padding:
                15px 0;

            margin-bottom:
                15px;

        }


        .item {

            display:
                flex;

            justify-content:
                space-between;

            padding:
                6px 0;

        }


        .order-bottom {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .total {

            font-size:
                18px;

            font-weight:
                bold;

        }


        .status-control {

            display:
                flex;

            gap:
                10px;

            align-items:
                center;

        }


        select {

            padding:
                9px;

            border:
                1px solid #ddd;

            border-radius:
                6px;

            background:
                white;

        }


        /* =========================
           PRODUCTS
        ========================= */

        .products-layout {

            display:
                grid;

            grid-template-columns:
                350px 1fr;

            gap:
                25px;

            align-items:
                start;

        }


        .product-form-card,
        .products-card {

            background:
                white;

            border-radius:
                10px;

            padding:
                25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.06);

        }


        .product-form-card h3,
        .products-card h3 {

            margin-bottom:
                20px;

            font-size:
                20px;

        }


        .form-group {

            margin-bottom:
                18px;

        }


        .form-group label {

            display:
                block;

            margin-bottom:
                7px;

            font-size:
                12px;

            font-weight:
                bold;

            letter-spacing:
                1px;

            color:
                #756d66;

        }


        .form-group input,
        .form-group textarea {

            width:
                100%;

            padding:
                11px 12px;

            border:
                1px solid #ddd;

            border-radius:
                6px;

            background:
                white;

            color:
                #211b17;

            font-family:
                Arial,
                sans-serif;

            outline:
                none;

        }


        .form-group textarea {

            min-height:
                90px;

            resize:
                vertical;

        }


        .form-group input:focus,
        .form-group textarea:focus {

            border-color:
                #b89472;

        }


        .add-product-btn {

            width:
                100%;

            border:
                none;

            background:
                #211b17;

            color:
                white;

            padding:
                13px;

            border-radius:
                6px;

            cursor:
                pointer;

            font-weight:
                bold;

        }


        .add-product-btn:hover {

            opacity:
                0.9;

        }


        /* =========================
           EDIT FORM
        ========================= */

        #edit-product-container {

            display:
                none;

            margin-bottom:
                25px;

        }


        .edit-product-card {

            background:
                white;

            border-radius:
                10px;

            padding:
                25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.06);

        }


        .edit-product-card h3 {

            margin-bottom:
                20px;

            font-size:
                20px;

        }


        .edit-buttons {

            display:
                flex;

            gap:
                10px;

        }


        .save-edit-btn,
        .cancel-edit-btn {

            border:
                none;

            padding:
                12px 18px;

            border-radius:
                6px;

            cursor:
                pointer;

            font-weight:
                bold;

        }


        .save-edit-btn {

            background:
                #211b17;

            color:
                white;

        }


        .cancel-edit-btn {

            background:
                #e9e1da;

            color:
                #211b17;

        }


        .save-edit-btn:hover,
        .cancel-edit-btn:hover {

            opacity:
                0.85;

        }


        /* =========================
           PRODUCTS LIST
        ========================= */

        .products-list {

            display:
                grid;

            gap:
                15px;

        }


        .product-card {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

            padding:
                18px;

            border:
                1px solid #eee;

            border-radius:
                8px;

        }


        .product-info {

            display:
                flex;

            align-items:
                center;

            gap:
                15px;

            min-width:
                0;

        }


        .product-image {

            width:
                70px;

            height:
                70px;

            object-fit:
                cover;

            border-radius:
                8px;

            background:
                #eee;

            flex-shrink:
                0;

        }


        .product-details h4 {

            margin-bottom:
                5px;

            font-size:
                17px;

        }


        .product-details p {

            color:
                #756d66;

            font-size:
                13px;

            margin-bottom:
                4px;

        }


        .product-price {

            font-weight:
                bold;

            color:
                #211b17;

        }


        .availability {

            display:
                inline-block;

            margin-top:
                5px;

            padding:
                4px 8px;

            border-radius:
                20px;

            font-size:
                11px;

            font-weight:
                bold;

        }


        .available {

            background:
                #e4f3e6;

            color:
                #286b34;

        }


        .unavailable {

            background:
                #f5dddd;

            color:
                #8a3030;

        }


        .product-actions {

            display:
                flex;

            gap:
                8px;

            flex-shrink:
                0;

        }


        .product-action-btn {

            border:
                none;

            padding:
                9px 12px;

            border-radius:
                6px;

            cursor:
                pointer;

            font-size:
                12px;

            font-weight:
                bold;

        }


        .edit-btn {

            background:
                #211b17;

            color:
                white;

        }


        .toggle-btn {

            background:
                #e9e1da;

            color:
                #211b17;

        }


        .delete-btn {

            background:
                #f5dddd;

            color:
                #8a3030;

        }


        .product-action-btn:hover {

            opacity:
                0.8;

        }


        /* =========================
           EMPTY
        ========================= */

        .empty {

            text-align:
                center;

            padding:
                50px;

            background:
                white;

            border-radius:
                10px;

            color:
                #756d66;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1000px) {

            .stats-grid {

                grid-template-columns:
                    repeat(3, 1fr);

            }


            .products-layout {

                grid-template-columns:
                    1fr;

            }

        }


        @media (max-width: 700px) {

            header {

                padding:
                    20px;

            }


            main {

                margin-top:
                    25px;

            }


            .stats-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .dashboard-header {

                align-items:
                    flex-start;

                gap:
                    15px;

            }


            .header-buttons {

                flex-direction:
                    column;

            }


            .order-top,
            .order-bottom {

                flex-direction:
                    column;

                align-items:
                    flex-start;

                gap:
                    15px;

            }


            .status-control {

                width:
                    100%;

            }


            select {

                width:
                    100%;

            }


            .product-card {

                flex-direction:
                    column;

                align-items:
                    flex-start;

            }


            .product-actions {

                width:
                    100%;

            }


            .product-action-btn {

                flex:
                    1;

            }

        }


        @media (max-width: 500px) {

            .stats-grid {

                grid-template-columns:
                    1fr;

            }


            .admin-navigation {

                width:
                    100%;

            }


            .nav-btn {

                flex:
                    1;

            }


            .product-info {

                width:
                    100%;

            }


            .edit-buttons {

                flex-direction:
                    column;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        ☕ NOIR & BEAN
    </h1>

    <p>
        Admin Dashboard
    </p>

</header>


<main>


    <!-- =========================
         STATISTICS
    ========================== -->

    <div class="stats-grid">


        <div class="stat-card">

            <span class="stat-label">
                TOTAL ORDERS
            </span>

            <strong id="total-orders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span class="stat-label">
                PENDING
            </span>

            <strong id="pending-orders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span class="stat-label">
                PREPARING
            </span>

            <strong id="preparing-orders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span class="stat-label">
                DELIVERED
            </span>

            <strong id="delivered-orders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span class="stat-label">
                TOTAL SALES
            </span>

            <strong id="total-sales">
                ₦0
            </strong>

        </div>

    </div>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <div class="admin-navigation">


        <button
            class="nav-btn active"
            onclick="showSection('orders')"
        >
            Orders
        </button>


        <button
            class="nav-btn"
            onclick="showSection('products')"
        >
            Products
        </button>


    </div>


    <!-- =========================
         ORDERS SECTION
    ========================= -->

    <section
        id="orders-section"
        class="admin-section active"
    >


        <div class="dashboard-header">


            <h2>
                Orders
            </h2>


            <div class="header-buttons">


                <button
                    class="refresh-btn"
                    onclick="loadOrders()"
                >
                    Refresh
                </button>


                <button
                    class="logout-btn"
                    onclick="logout()"
                >
                    Logout
                </button>


            </div>


        </div>


        <div id="orders-container">

            <div class="empty">
                Loading orders...
            </div>

        </div>


    </section>


    <!-- =========================
         PRODUCTS SECTION
    ========================= -->

    <section
        id="products-section"
        class="admin-section"
    >


        <div class="dashboard-header">

            <h2>
                Products
            </h2>

        </div>


        <!-- =========================
             EDIT PRODUCT FORM
        ========================= -->

        <div
            id="edit-product-container"
        >

            <div class="edit-product-card">


                <h3>
                    Edit Product
                </h3>


                <form
                    id="edit-product-form"
                >


                    <input
                        type="hidden"
                        id="edit-product-id"
                    >


                    <div class="form-group">

                        <label
                            for="edit-product-name"
                        >
                            PRODUCT NAME
                        </label>

                        <input
                            type="text"
                            id="edit-product-name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            for="edit-product-description"
                        >
                            DESCRIPTION
                        </label>

                        <textarea
                            id="edit-product-description"
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label
                            for="edit-product-price"
                        >
                            PRICE
                        </label>

                        <input
                            type="number"
                            id="edit-product-price"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            for="edit-product-category"
                        >
                            CATEGORY
                        </label>

                        <input
                            type="text"
                            id="edit-product-category"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            for="edit-product-image"
                        >
                            IMAGE PATH
                        </label>

                        <input
                            type="text"
                            id="edit-product-image"
                            placeholder="/images/coffee.jpg"
                        >

                    </div>


                    <div class="edit-buttons">


                        <button
                            type="submit"
                            class="save-edit-btn"
                        >
                            SAVE CHANGES
                        </button>


                        <button
                            type="button"
                            class="cancel-edit-btn"
                            onclick="cancelEdit()"
                        >
                            CANCEL
                        </button>


                    </div>


                </form>


            </div>

        </div>


        <div class="products-layout">


            <!-- =========================
                 ADD PRODUCT
            ========================== -->

            <div class="product-form-card">


                <h3>
                    Add Product
                </h3>


                <form
                    id="product-form"
                >


                    <div class="form-group">

                        <label
                            for="product-name"
                        >
                            PRODUCT NAME
                        </label>

                        <input
                            type="text"
                            id="product-name"
                            placeholder="e.g. Vanilla Latte"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            for="product-description"
                        >
                            DESCRIPTION
                        </label>

                        <textarea
                            id="product-description"
                            placeholder="Describe the product"
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label
                            for="product-price"
                        >
                            PRICE
                        </label>

                        <input
                            type="number"
                            id="product-price"
                            placeholder="2500"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            for="product-category"
                        >
                            CATEGORY
                        </label>

                        <input
                            type="text"
                            id="product-category"
                            placeholder="Coffee"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            for="product-image"
                        >
                            IMAGE PATH
                        </label>

                        <input
                            type="text"
                            id="product-image"
                            placeholder="/images/coffee.jpg"
                        >

                    </div>


                    <button
                        type="submit"
                        class="add-product-btn"
                    >
                        ADD PRODUCT
                    </button>


                </form>


            </div>


            <!-- =========================
                 PRODUCTS LIST
            ========================== -->

            <div class="products-card">


                <h3>
                    Product List
                </h3>


                <div
                    id="products-list"
                    class="products-list"
                >

                    <div class="empty">
                        Loading products...
                    </div>

                </div>


            </div>


        </div>


    </section>


</main>


<script>


    const API_URL =
    "https://noir-and-bean-uwub.onrender.com"; ;


    /* =========================
       SHOW SECTION
    ========================= */

    function showSection(
        section
    ) {

        const ordersSection =
            document.getElementById(
                "orders-section"
            );


        const productsSection =
            document.getElementById(
                "products-section"
            );


        const buttons =
            document.querySelectorAll(
                ".nav-btn"
            );


        if (
            section ===
            "orders"
        ) {

            ordersSection.classList.add(
                "active"
            );


            productsSection.classList.remove(
                "active"
            );


            buttons[0].classList.add(
                "active"
            );


            buttons[1].classList.remove(
                "active"
            );

        }


        if (
            section ===
            "products"
        ) {

            ordersSection.classList.remove(
                "active"
            );


            productsSection.classList.add(
                "active"
            );


            buttons[0].classList.remove(
                "active"
            );


            buttons[1].classList.add(
                "active"
            );


            loadProducts();

        }

    }


    /* =========================
       LOAD ORDERS
    ========================= */

    async function loadOrders() {

        const container =
            document.getElementById(
                "orders-container"
            );


        container.innerHTML = `

            <div class="empty">
                Loading orders...
            </div>

        `;


        try {

            const response =
                await fetch(
                    `${API_URL}/api/orders`,
                    {

                        headers: {

                            "Authorization":
                                `Bearer ${adminToken}`

                        }

                    }
                );


            if (
                response.status ===
                401
            ) {

                logout();

                return;

            }


            if (
                !response.ok
            ) {

                throw new Error(
                    "Failed to load orders"
                );

            }


            const orders =
                await response.json();


            updateStatistics(
                orders
            );


            if (
                orders.length ===
                0
            ) {

                container.innerHTML = `

                    <div class="empty">
                        No orders yet.
                    </div>

                `;

                return;

            }


            container.innerHTML =
                "";


            orders.forEach(
                order => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "order-card";


                    const itemsHTML =
                        order.items
                            .map(
                                item => `

                                    <div class="item">

                                        <span>

                                            ${item.product.name}
                                            × ${item.quantity}

                                        </span>


                                        <strong>

                                            ₦${(
                                                Number(
                                                    item.price
                                                ) *
                                                item.quantity
                                            ).toLocaleString()}

                                        </strong>

                                    </div>

                                `
                            )
                            .join(
                                ""
                            );


                    card.innerHTML = `

                        <div class="order-top">

                            <div class="order-id">

                                Order #${order.id}

                            </div>


                            <div class="status">

                                ${order.status}

                            </div>

                        </div>


                        <div class="customer">

                            <strong>

                                ${order.customer.name}

                            </strong>

                            <br>

                            ${order.customer.email}

                            <br>

                            ${order.customer.phone}

                            <br>

                            ${order.customer.address}

                        </div>


                        <div class="items">

                            ${itemsHTML}

                        </div>


                        <div class="order-bottom">


                            <div class="total">

                                Total:
                                ₦${Number(
                                    order.total
                                ).toLocaleString()}

                            </div>


                            <div class="status-control">


                                <label>
                                    Status:
                                </label>


                                <select
                                    onchange="
                                        updateOrderStatus(
                                            ${order.id},
                                            this.value
                                        )
                                    "
                                >


                                    <option
                                        value="pending"
                                        ${
                                            order.status ===
                                            "pending"
                                                ? "selected"
                                                : ""
                                        }
                                    >
                                        Pending
                                    </option>


                                    <option
                                        value="confirmed"
                                        ${
                                            order.status ===
                                            "confirmed"
                                                ? "selected"
                                                : ""
                                        }
                                    >
                                        Confirmed
                                    </option>


                                    <option
                                        value="preparing"
                                        ${
                                            order.status ===
                                            "preparing"
                                                ? "selected"
                                                : ""
                                        }
                                    >
                                        Preparing
                                    </option>


                                    <option
                                        value="ready"
                                        ${
                                            order.status ===
                                            "ready"
                                                ? "selected"
                                                : ""
                                        }
                                    >
                                        Ready
                                    </option>


                                    <option
                                        value="delivered"
                                        ${
                                            order.status ===
                                            "delivered"
                                                ? "selected"
                                                : ""
                                        }
                                    >
                                        Delivered
                                    </option>


                                    <option
                                        value="cancelled"
                                        ${
                                            order.status ===
                                            "cancelled"
                                                ? "selected"
                                                : ""
                                        }
                                    >
                                        Cancelled
                                    </option>


                                </select>


                            </div>


                        </div>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );


        } catch (
            error
        ) {

            console.error(
                error
            );


            container.innerHTML = `

                <div class="empty">
                    Failed to load orders.
                </div>

            `;

        }

    }


    /* =========================
       UPDATE STATISTICS
    ========================= */

    function updateStatistics(
        orders
    ) {

        const totalOrders =
            orders.length;


        const pendingOrders =
            orders.filter(
                order =>
                    order.status ===
                    "pending"
            ).length;


        const preparingOrders =
            orders.filter(
                order =>
                    order.status ===
                    "preparing"
            ).length;


        const deliveredOrders =
            orders.filter(
                order =>
                    order.status ===
                    "delivered"
            ).length;


        const totalSales =
            orders
                .filter(
                    order =>
                        order.status !==
                        "cancelled"
                )
                .reduce(
                    (
                        sum,
                        order
                    ) =>
                        sum +
                        Number(
                            order.total
                        ),
                    0
                );


        document.getElementById(
            "total-orders"
        ).textContent =
            totalOrders;


        document.getElementById(
            "pending-orders"
        ).textContent =
            pendingOrders;


        document.getElementById(
            "preparing-orders"
        ).textContent =
            preparingOrders;


        document.getElementById(
            "delivered-orders"
        ).textContent =
            deliveredOrders;


        document.getElementById(
            "total-sales"
        ).textContent =
            "₦" +
            totalSales.toLocaleString();

    }


    /* =========================
       UPDATE ORDER STATUS
    ========================= */

    async function updateOrderStatus(
        orderId,
        status
    ) {

        try {

            const response =
                await fetch(
                    `${API_URL}/api/orders/${orderId}/status`,
                    {

                        method:
                            "PATCH",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${adminToken}`

                        },

                        body:
                            JSON.stringify({

                                status:
                                    status

                            })

                    }
                );


            if (
                response.status ===
                401
            ) {

            }

                !response.ok
            ) {

                throw new Error(
                    "Failed to update order status"
                );

            }


            await loadOrders();


        } catch (

        ) {

            console.error(
                error
            );

                "Failed to update order status."
            );

    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

        const container =
            document.getElementById(
                "products-list"
            );


        container.innerHTML = `

            <div class="empty">
                Loading products...
            </div>

        `;


        try {

            const response =
                await fetch(
                    `${API_URL}/api/products`
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "Failed to load products"
                );

            }


            const products =
                await response.json();


            if (
                products.length ===
                0
            ) {

                container.innerHTML = `

                    <div class="empty">
                        No products yet.
                    </div>

                `;

                return;

            }


            container.innerHTML =
                "";


            products.forEach(
                product => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "product-card";


                    const image =
                        product.image ||
                        "";


                    card.innerHTML = `

                        <div class="product-info">


                            ${
                                image
                                    ? `

                                        <img
                                            class="product-image"
                                            src="${image}"
                                            alt="${product.name}"
                                            onerror="
                                                this.style.display='none'
                                            "
                                        >

                                      `
                                    : ""
                            }


                            <div class="product-details">


                                <h4>
                                    ${product.name}
                                </h4>


                                <p>
                                    ${product.category}
                                </p>


                                <p class="product-price">

                                    ₦${Number(
                                        product.price
                                    ).toLocaleString()}

                                </p>


                                <span
                                    class="availability ${
                                        product.available
                                            ? "available"
                                            : "unavailable"
                                    }"
                                >

                                    ${
                                        product.available
                                            ? "AVAILABLE"
                                            : "UNAVAILABLE"
                                    }

                                </span>


                            </div>


                        </div>


                        <div class="product-actions">


                            <button
                                class="product-action-btn edit-btn"
                                onclick="
                                    editProduct(
                                        ${product.id}
                                    )
                                "
                            >
                                Edit
                            </button>


                            <button
                                class="product-action-btn toggle-btn"
                                onclick="
                                    toggleProductAvailability(
                                        ${product.id},
                                        ${product.available}
                                    )
                                "
                            >

                                ${
                                    product.available
                                        ? "Disable"
                                        : "Enable"
                                }

                            </button>


                            <button
                                class="product-action-btn delete-btn"
                                onclick="
                                    deleteProduct(
                                        ${product.id}
                                    )
                                "
                            >
                                Delete
                            </button>


                        </div>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );


        } catch (
            error
        ) {

            console.error(
                error
            );


            container.innerHTML = `

                <div class="empty">
                    Failed to load products.
                </div>

            `;

        }

    }

    ========================= */

        )
        .addEventListener(
            "submit",

                event
            ) {

                event.preventDefault();

                    document
                        .getElementById(
                            "product-name"
                        )
                        .value
                        .trim();


                const description =
                    document
                        .getElementById(
                            "product-description"
                        )
                        .value
                        .trim();


                const price =
                    document
                        .getElementById(
                            "product-price"
                        )
                        .value;


                const category =
                    document
                        .getElementById(
                            "product-category"
                        )
                        .value
                        .trim();


                const image =
                    document
                        .getElementById(
                            "product-image"
                        )
                        .value
                        .trim();


                try {

                    const response =
                        await fetch(
                            `${API_URL}/api/products`,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${adminToken}`

                                body:
                                    JSON.stringify({

                    if (

                    if (
                        !response.ok
                    ) {

                        throw new Error(

                        );

                    }


                    alert(

                    document
                        .getElementById(
                            "product-form"
                        )
                        .reset();

                ) {

                    console.error(
                        error
                    );


                    alert(
                        error.message
                    );

                }

            }
        );


    /* =========================
       EDIT PRODUCT
    ========================= */

    async function editProduct(
        productId
    ) {

        try {

            const response =
                await fetch(
                    `${API_URL}/api/products/${productId}`
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "Failed to load product"
                );

            }


            const product =
                await response.json();


            document.getElementById(
                "edit-product-id"
            ).value =
                product.id;


            document.getElementById(
                "edit-product-name"
            ).value =
                product.name;


            document.getElementById(
                "edit-product-description"
            ).value =
                product.description ||
                "";


            document.getElementById(
                "edit-product-price"
            ).value =
                Number(
                    product.price
                );


            document.getElementById(
                "edit-product-category"
            ).value =
                product.category;


            document.getElementById(
                "edit-product-image"
            ).value =
                product.image ||
                "";


            const editContainer =
                document.getElementById(
                    "edit-product-container"
                );


            editContainer.style.display =
                "block";


            editContainer.scrollIntoView({
                behavior:
                    "smooth",
                block:
                    "start"
            });


        } catch (
            error
        ) {

            console.error(
                error
            );


            alert(
                "Failed to load product."
            );

        }

    }

            .getElementById(

            )

    /* =========================
       TOGGLE PRODUCT
    ========================= */

    async function toggleProductAvailability(
        productId,
        currentStatus
    ) {

        try {

            const response =
                await fetch(
                    `${API_URL}/api/products/${productId}`,
                    {

                        method:
                            "PATCH",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${adminToken}`

                        },

                        body:
                            JSON.stringify({

                                available:
                                    !currentStatus

                            })

                    }
                );


            if (
                response.status ===
                401
            ) {

                logout();

                return;

            }


            if (
                !response.ok
            ) {

                const data =
                    await response.json();


                throw new Error(
                    data.error ||
                    "Failed to update product"
                );

            }


            await loadProducts();


        } catch (
            error
        ) {

            console.error(
                error
            );


            alert(
                error.message
            );

        }

    }


    /* =========================
       DELETE PRODUCT
    ========================= */

    async function deleteProduct(
        productId
    ) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this product?"
            );


        if (
            !confirmed
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/products/${productId}`,
                    {

                        method:
                            "DELETE",

                        headers: {

                            "Authorization":
                                `Bearer ${adminToken}`

                        }

                    }
                );


            if (
                response.status ===
                401
            ) {

                logout();

                return;

            }


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.error ||
                    "Failed to delete product"
                );

            }


            await loadProducts();


        } catch (
            error
        ) {

            console.error(
                error
            );


            alert(
                error.message
            );

        }

    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

        localStorage.removeItem(
            "adminToken"
        );


        window.location.replace(
            "login.html"
        );

    }


    /* =========================
       START DASHBOARD
    ========================= */

    loadOrders();

</script>
